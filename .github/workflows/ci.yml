name: Warehouse validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dbt-duckdb:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: python scripts/make_fixture.py
      - run: python scripts/run_local.py --input data/fixture
      - run: python scripts/assert_fixture.py
      - run: python scripts/check_negative_test.py
      - run: dbt build --profiles-dir profiles --target local
      - run: dbt docs generate --profiles-dir profiles --target local
      - name: Build and test local workflow container
        run: |
          docker build -t commerceflow:test .
          docker run --rm commerceflow:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-validation
          path: |
            target/manifest.json
            target/run_results.json
            target/evidence.json
            logs/dbt.log
  airflow-local:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/data/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__UNIT_TEST_MODE: 'true'
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock.txt
          python -m venv .airflow-venv
          .airflow-venv/bin/pip install -r requirements-airflow.txt
      - run: .venv/bin/python scripts/make_fixture.py
      - run: .airflow-venv/bin/airflow db migrate
      - run: .airflow-venv/bin/python scripts/test_airflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airflow-validation
          path: |
            target/airflow-test.json
            target/airflow-reconciliation.json
